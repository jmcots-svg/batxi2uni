name: Actualització Automàtica Dades Generalitat

on:
  schedule:
    # 1 de cada mes a les 06:00 UTC
    - cron: '0 6 1 * *'
    # 15 de maig, juliol, setembre i octubre (mesos de publicacions clau) a les 06:00 UTC
    - cron: '0 6 15 5,7,9,10 *'
  workflow_dispatch: # Permet execució manual amb 1 sol clic

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repositori
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instal·lar dependències
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar actualitzador de dades
        run: |
          python scripts/update_data.py --year 2026

      - name: Comprovar i fer commit dels canvis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ponderaciones.csv index.html scripts/
          if git diff --staged --quiet; then
            echo "No hi ha canvis a les dades oficials de la Generalitat."
          else
            git commit -m "Auto-update: Actualització oficial ponderacions i notes de tall [skip ci]"
            git push
            echo "Dades actualitzades i pujades correctament al repositori."
          fi
